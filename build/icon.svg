<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="0.55" stop-color="#1640B8"/>
      <stop offset="1" stop-color="#0A1A4A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.12" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E6EEFF"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2F6BFF"/>
      <stop offset="1" stop-color="#1640B8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#030B26" flood-opacity="0.45"/>
    </filter>
    <filter id="iconShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- macOS squircle on the standard 824px grid -->
  <g filter="url(#iconShadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#glow)"/>
    <rect x="101.5" y="101.5" width="821" height="821" rx="184.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="3"/>
  </g>

  <!-- note card -->
  <g filter="url(#shadow)">
    <path d="M300 238 H640 L736 334 V744 a42 42 0 0 1 -42 42 H300 a42 42 0 0 1 -42 -42 V280 a42 42 0 0 1 42 -42 Z" fill="url(#card)"/>
    <!-- folded corner -->
    <path d="M640 238 V300 a34 34 0 0 0 34 34 H736 Z" fill="#B9CCFA"/>
  </g>

  <!-- sound wave: what was heard -->
  <g fill="url(#wave)">
    <rect x="318" y="372" width="26" height="60"  rx="13"/>
    <rect x="362" y="340" width="26" height="124" rx="13"/>
    <rect x="406" y="312" width="26" height="180" rx="13"/>
    <rect x="450" y="352" width="26" height="100" rx="13"/>
    <rect x="494" y="330" width="26" height="144" rx="13"/>
    <rect x="538" y="366" width="26" height="72"  rx="13"/>
    <rect x="582" y="384" width="26" height="36"  rx="13"/>
  </g>

  <!-- ...becomes notes -->
  <g fill="#0A1A4A">
    <circle cx="331" cy="560" r="14" fill="#2F6BFF"/>
    <rect x="364" y="547" width="306" height="26" rx="13" opacity="0.85"/>
    <circle cx="331" cy="632" r="14" fill="#2F6BFF"/>
    <rect x="364" y="619" width="250" height="26" rx="13" opacity="0.55"/>
    <circle cx="331" cy="704" r="14" fill="#2F6BFF"/>
    <rect x="364" y="691" width="190" height="26" rx="13" opacity="0.35"/>
  </g>
</svg>
